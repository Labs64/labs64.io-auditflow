name: Labs64.IO - AuditFlow - Publish Docker

# Publishes the three AuditFlow component images to Docker Hub on GitHub Release
# (image names match the Helm chart repositories):
#   * auditflow-be          -> labs64/auditflow
#   * auditflow-transformer -> labs64/auditflow-transformer
#   * auditflow-sink        -> labs64/auditflow-sink
#
# All three carry the same version. The chart's appVersion is a single scalar and
# every image defaults its tag to it, so the three release as one set — if any
# publish job fails the release is incomplete and must not be propagated to the
# chart with a partial set of digests.
#
# The test jobs are repeated here rather than assumed from labs64io-ci.yml: a
# release can be cut from any tag, including a commit that never ran CI.

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: all three suites must pass before anything is pushed
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test backend (Java)
    # working-directory is auditflow-be rather than the reactor root so the gate
    # resolves auditflow-api exactly the way the published image does (from Nexus,
    # not from a locally built sibling).
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    with:
      working-directory: auditflow-be
      java-version: "25"
      maven-goals: verify
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}

  test-transformer:
    name: Test transformer (Python)
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@master
    with:
      working-directory: auditflow-transformer
      cache-dependency-path: |
        auditflow-transformer/requirements.txt
        auditflow-transformer/requirements-dev.txt

  test-sink:
    name: Test sink (Python)
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@master
    with:
      working-directory: auditflow-sink
      cache-dependency-path: |
        auditflow-sink/requirements.txt
        auditflow-sink/requirements-dev.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — each job emits image/tag/digest/image-ref outputs
  # ─────────────────────────────────────────────────────────────────────────────
  publish-be:
    name: Build & Push Backend image (labs64/auditflow)
    needs: [test-backend, test-transformer, test-sink]
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow
      context: ./auditflow-be
      mode: release
      version: ${{ github.event.release.tag_name }}
      # The auditflow-be Dockerfile copies target/*.jar, so build the jar first.
      build-command: mvn -B -ntp -DskipTests package --file ./auditflow-be/pom.xml
      java-version: "25"
    secrets: inherit

  publish-transformer:
    name: Build & Push Transformer image (labs64/auditflow-transformer)
    needs: [test-backend, test-transformer, test-sink]
    # Self-contained Python image — no pre-build step needed.
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow-transformer
      context: ./auditflow-transformer
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  publish-sink:
    name: Build & Push Sink image (labs64/auditflow-sink)
    needs: [test-backend, test-transformer, test-sink]
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow-sink
      context: ./auditflow-sink
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify the release is complete before anything downstream consumes it
  # ─────────────────────────────────────────────────────────────────────────────
  release-images:
    name: Release image digests
    needs: [publish-be, publish-transformer, publish-sink]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          VERSION: ${{ github.event.release.tag_name }}
          BE_REF: ${{ needs.publish-be.outputs.image-ref }}
          TRN_REF: ${{ needs.publish-transformer.outputs.image-ref }}
          SNK_REF: ${{ needs.publish-sink.outputs.image-ref }}
          BE_DIGEST: ${{ needs.publish-be.outputs.digest }}
          TRN_DIGEST: ${{ needs.publish-transformer.outputs.digest }}
          SNK_DIGEST: ${{ needs.publish-sink.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "$BE_REF" "$TRN_REF" "$SNK_REF"; do
            if [[ -z "$ref" ]]; then
              echo "::error::incomplete release — one or more images produced no digest"
              exit 1
            fi
          done
          {
            echo "## AuditFlow ${VERSION} — image digests"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| auditflow | \`${BE_DIGEST}\` |"
            echo "| auditflow-transformer | \`${TRN_DIGEST}\` |"
            echo "| auditflow-sink | \`${SNK_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Propagate to the chart — opens a PR in labs64.io-helm-charts pinning all three
  # digests. Needs release-images so a partial release can never be propagated.
  # ─────────────────────────────────────────────────────────────────────────────
  propagate-to-chart:
    name: Pin digests in charts/auditflow
    needs: [publish-be, publish-transformer, publish-sink, release-images]
    uses: Labs64/labs64.io-workspace/.github/workflows/chart-update-dispatch.yml@master
    with:
      chart: auditflow
      version: ${{ github.event.release.tag_name }}
      images: |
        ${{ needs.publish-be.outputs.image-ref }}
        ${{ needs.publish-transformer.outputs.image-ref }}
        ${{ needs.publish-sink.outputs.image-ref }}
    secrets:
      CHART_DISPATCH_TOKEN: ${{ secrets.CHART_DISPATCH_TOKEN }}
