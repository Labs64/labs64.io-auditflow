# Compose-local tenant config, mounted read-only into the backend at /config/tenants.
# Reserved pseudo-tenant for tenantless service-principal (platform) events — carries the
# pipelines previously configured via -Dauditflow.pipelines[N].* JAVA_OPTS (which now fail startup).
# Hot-reloaded: edits are picked up by the local-dir poll within ~5s, no restart.
tenantId: _platform
enabled: true
quota:
  rateLimitPerSec: 200
  burst: 400
pipelines:
  - name: e2e-logging
    enabled: true
    transformer:
      name: zero
    sink:
      name: logging_sink
      properties:
        log-level: DEBUG
        format: json
  - name: security-alerts
    enabled: true
    condition:
      match: all
      rules:
        - field: eventType
          operator: eq
          value: security.alert
    transformer:
      name: zero
    sink:
      name: logging_sink
      properties:
        log-level: WARN
        format: json
  # ClickHouse analytics sink — enabled by default; ClickHouse is part of the default compose
  # stack and applies examples/clickhouse/schema.sql on first start. Every event published here
  # lands in audit.audit_events (query with `just ch-events`; the asserted round trip is
  # section 6 of examples/getting-started.ipynb).
  # Tenant config is hot-reloaded, so flipping `enabled` takes effect within ~5s, no restart.
  - name: clickhouse-analytics
    enabled: true
    transformer:
      # The generic, domain-free transformer: core audit columns only, everything else preserved
      # in the `extra` map column. Contrast with tenants/demo.yaml, which points the same sink at
      # a use-case layer that promotes licensing/monetization keys into their own columns.
      name: audit_clickhouse
    sink:
      name: clickhouse_sink
      properties:
        service-url: http://clickhouse:8123
        database: audit
        table: audit_events
        username: auditflow
        password: auditflow
