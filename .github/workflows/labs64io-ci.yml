name: Labs64.IO - AuditFlow - CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: auditflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Item 8: the v1 API contract is frozen — additive-only, breaking changes need
  # a v2 spec. Diffs openapi-audit-v1.yaml against its version on the PR base
  # branch and fails the build if anything was removed or narrowed. Only
  # meaningful on pull_request (a push to master has nothing to diff against).
  api-contract-freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install checker dependencies
        run: pip install pyyaml pytest

      - name: Test the breaking-change checker
        # A gate nobody tests reports "no breaking changes" forever.
        run: pytest scripts/test_check_openapi_breaking_changes.py -q

      - name: No breaking changes to the frozen v1 contract
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python scripts/check_openapi_breaking_changes.py \
            auditflow-api/src/main/resources/openapi/openapi-audit-v1.yaml \
            --base-ref "origin/$BASE_REF"

  # Java API client library — no live deps, no dependency-graph submission needed
  # (auditflow-be's submission already covers the module's own reactor).
  build-api:
    permissions:
      contents: read
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      working-directory: auditflow-api
      java-version: "17"
      maven-goals: verify
      artifact-name: api-test-results

  # Java backend — no live deps (tests mock/embed what they need); Docker build
  # sanity check + Dependabot dependency-graph submission on top of test+verify.
  build-backend:
    permissions:
      contents: write
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      working-directory: .
      java-version: "25"
      maven-goals: -pl auditflow-be -am verify
      artifact-name: backend-test-results
      docker-build-context: auditflow-be
      docker-build-tag: auditflow:ci-${{ github.sha }}
      submit-dependency-graph: true

  # Python transformer service
  build-transformer:
    permissions:
      contents: read
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@master
    with:
      working-directory: auditflow-transformer
      install-command: pip install -r requirements-dev.txt
      test-command: pytest -v --tb=short --junit-xml=test-results.xml
      cache-dependency-path: |
        auditflow-transformer/requirements.txt
        auditflow-transformer/requirements-dev.txt
      docker-context: auditflow-transformer
      artifact-name: transformer-test-results
      test-results-path: test-results.xml

  # Python sink service
  build-sink:
    permissions:
      contents: read
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@master
    with:
      working-directory: auditflow-sink
      install-command: pip install -r requirements-dev.txt
      test-command: pytest -v --tb=short --junit-xml=test-results.xml
      cache-dependency-path: |
        auditflow-sink/requirements.txt
        auditflow-sink/requirements-dev.txt
      docker-context: auditflow-sink
      artifact-name: sink-test-results
      test-results-path: test-results.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Edge images — pushed to Docker Hub as :edge after a green master build, so
  # downstream integration environments can run today's master without building
  # it. labs64.io-tests' nightly regression deploys exactly these (see that
  # repo's labs64io-regression-suite.yml); the release path, which additionally
  # pins digests into the Helm chart, stays in labs64io-docker-publish.yml.
  #
  # All three gate on ALL four build jobs, exactly as the release workflow does.
  # The three containers share a single pod in every deployment
  # (transformer/sink `discovery.mode: local`), so a partially-refreshed :edge
  # trio is not a degraded environment, it is a broken one.
  # ─────────────────────────────────────────────────────────────────────────────
  edge-image-be:
    name: Edge image (labs64/auditflow)
    needs: [build-api, build-backend, build-transformer, build-sink]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow
      context: ./auditflow-be
      mode: edge
      # The auditflow-be Dockerfile copies target/*.jar, so build the jar first.
      # Building from auditflow-be's own pom (not the reactor root) resolves
      # auditflow-api from Nexus, the same way the released image does.
      build-command: mvn -B -ntp -DskipTests package --file ./auditflow-be/pom.xml
      java-version: "25"
    secrets: inherit

  edge-image-transformer:
    name: Edge image (labs64/auditflow-transformer)
    needs: [build-api, build-backend, build-transformer, build-sink]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow-transformer
      context: ./auditflow-transformer
      mode: edge
    secrets: inherit

  edge-image-sink:
    name: Edge image (labs64/auditflow-sink)
    needs: [build-api, build-backend, build-transformer, build-sink]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/auditflow-sink
      context: ./auditflow-sink
      mode: edge
    secrets: inherit
