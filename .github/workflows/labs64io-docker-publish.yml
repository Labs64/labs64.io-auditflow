name: Labs64.IO - AuditFlow - Release

# One AuditFlow release = one version, the GitHub Release tag (X.Y.Z), carried by
# everything this workflow publishes:
#   * auditflow-be          -> labs64/auditflow               (Docker Hub)
#   * auditflow-transformer -> labs64/auditflow-transformer   (Docker Hub)
#   * auditflow-sink        -> labs64/auditflow-sink          (Docker Hub)
#   * auditflow-api         -> io.labs64:auditflow-api        (Labs64 Nexus; Maven Central when
#                                                              the variable PUBLISH_MAVEN_CENTRAL=true)
# (image names match the Helm chart repositories).
#
# No pom carries a version: the backend jar and the API client are built from the
# tagged commit with -Drevision=<tag>. That build refuses any -SNAPSHOT parent or
# dependency, so pin a released io.labs64:labs64io-parent before releasing.
#
# The chart's appVersion is a single scalar and every image defaults its tag to it,
# so the artifacts release as one set — if any publish job fails the release is
# incomplete and must not be propagated to the chart with a partial set of digests.
#
# The test jobs are repeated here rather than assumed from labs64io-ci.yml: a
# release can be cut from any tag, including a commit that never ran CI.

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: all three suites must pass before anything is pushed
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test backend (Java)
    # Reactor build (-am), exactly like the published image: auditflow-api comes
    # from this same tagged commit, not from whatever snapshot Nexus holds.
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@v1
    with:
      working-directory: .
      maven-goals: -pl auditflow-be -am verify
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}

  test-transformer:
    name: Test transformer (Python)
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@v1
    with:
      working-directory: auditflow-transformer
      cache-dependency-path: |
        auditflow-transformer/requirements.txt
        auditflow-transformer/requirements-dev.txt

  test-sink:
    name: Test sink (Python)
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@v1
    with:
      working-directory: auditflow-sink
      cache-dependency-path: |
        auditflow-sink/requirements.txt
        auditflow-sink/requirements-dev.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — each job emits image/tag/digest/image-ref outputs
  # ─────────────────────────────────────────────────────────────────────────────
  publish-be:
    name: Build & Push Backend image (labs64/auditflow)
    needs: [test-backend, test-transformer, test-sink]
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@v1
    with:
      image: labs64/auditflow
      context: ./auditflow-be
      mode: release
      version: ${{ github.event.release.tag_name }}
      # The auditflow-be Dockerfile copies target/*.jar, so build the jar first.
      # docker-publish.yml adds -Drevision=<version>, so the jar carries the tag.
      build-command: mvn -B -ntp -DskipTests -pl auditflow-be -am package
    secrets: inherit

  publish-transformer:
    name: Build & Push Transformer image (labs64/auditflow-transformer)
    needs: [test-backend, test-transformer, test-sink]
    # Self-contained Python image — no pre-build step needed.
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@v1
    with:
      image: labs64/auditflow-transformer
      context: ./auditflow-transformer
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  publish-sink:
    name: Build & Push Sink image (labs64/auditflow-sink)
    needs: [test-backend, test-transformer, test-sink]
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@v1
    with:
      image: labs64/auditflow-sink
      context: ./auditflow-sink
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # The Java client other modules pin (payment-gateway's auditflow-api.version),
  # at the same version as the images. JDK 17: the client targets Java 17 consumers.
  publish-api:
    name: Publish API client (io.labs64:auditflow-api)
    needs: [test-backend, test-transformer, test-sink]
    uses: Labs64/labs64.io-workspace/.github/workflows/maven-publish.yml@v1
    with:
      working-directory: auditflow-api
      mode: release
      version: ${{ github.event.release.tag_name }}
      java-version: "17"
      # Maven Central as well as Nexus, like the commons libraries (same repository variable).
      publish-central: ${{ vars.PUBLISH_MAVEN_CENTRAL == 'true' }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify the release is complete before anything downstream consumes it
  # ─────────────────────────────────────────────────────────────────────────────
  release-images:
    name: Release image digests
    needs: [publish-be, publish-transformer, publish-sink]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          VERSION: ${{ github.event.release.tag_name }}
          BE_REF: ${{ needs.publish-be.outputs.image-ref }}
          TRN_REF: ${{ needs.publish-transformer.outputs.image-ref }}
          SNK_REF: ${{ needs.publish-sink.outputs.image-ref }}
          BE_DIGEST: ${{ needs.publish-be.outputs.digest }}
          TRN_DIGEST: ${{ needs.publish-transformer.outputs.digest }}
          SNK_DIGEST: ${{ needs.publish-sink.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "$BE_REF" "$TRN_REF" "$SNK_REF"; do
            if [[ -z "$ref" ]]; then
              echo "::error::incomplete release — one or more images produced no digest"
              exit 1
            fi
          done
          {
            echo "## AuditFlow ${VERSION} — image digests"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| auditflow | \`${BE_DIGEST}\` |"
            echo "| auditflow-transformer | \`${TRN_DIGEST}\` |"
            echo "| auditflow-sink | \`${SNK_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Propagate to the chart — opens a PR in labs64.io-helm-charts pinning all three
  # digests. Needs release-images so a partial release can never be propagated.
  # ─────────────────────────────────────────────────────────────────────────────
  propagate-to-chart:
    name: Pin digests in charts/auditflow
    needs: [publish-be, publish-transformer, publish-sink, publish-api, release-images]
    uses: Labs64/labs64.io-workspace/.github/workflows/chart-update-dispatch.yml@v1
    with:
      chart: auditflow
      version: ${{ github.event.release.tag_name }}
      images: |
        ${{ needs.publish-be.outputs.image-ref }}
        ${{ needs.publish-transformer.outputs.image-ref }}
        ${{ needs.publish-sink.outputs.image-ref }}
    secrets:
      CHART_DISPATCH_TOKEN: ${{ secrets.CHART_DISPATCH_TOKEN }}
