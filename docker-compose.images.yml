# Run AuditFlow from the published Docker Hub images: no JDK, no Maven, no local build.
#
#   docker compose -f docker-compose.yml -f docker-compose.images.yml up -d
#
# Layered on top of docker-compose.yml, which still supplies RabbitMQ, Valkey and ClickHouse,
# the demo tenant and the wiring. Pin a release with AUDITFLOW_VERSION=0.1.6 (default: latest).
#
# Cerbos is not started: its policies are generated by the Maven build, and the local stack
# runs with authorization disabled (no gateway in front of it). Use the source build
# (docker-compose.yml alone) to run the central authorization decision point locally.
services:
  backend:
    image: labs64/auditflow:${AUDITFLOW_VERSION:-latest}
    build: !reset null
    depends_on: !override
      rabbitmq:
        condition: service_healthy
      transformer:
        condition: service_healthy
      sink:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  transformer:
    image: labs64/auditflow-transformer:${AUDITFLOW_VERSION:-latest}
    build: !reset null

  sink:
    image: labs64/auditflow-sink:${AUDITFLOW_VERSION:-latest}
    build: !reset null

  cerbos:
    profiles: ["authz"]
