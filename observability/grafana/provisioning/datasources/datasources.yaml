apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]+)"'
          name: TraceID
          url: '$${__value.raw}'
          urlDisplayLabel: View Trace in Tempo

  # Analytics sink for the audit stream. The plugin itself is installed via GF_INSTALL_PLUGINS in
  # docker-compose-observability.yml, which downloads it at container start — a fresh `just up obs`
  # needs network access, and on an air-gapped host Grafana comes up without this data source.
  # Event vocabulary and queries: examples/clickhouse/NETLICENSING_EVENTS.md
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    jsonData:
      # `audit` is where schema.sql creates audit_events — leaving this at `default` makes every
      # pasted query fail with "table doesn't exist" until the user notices the database picker.
      defaultDatabase: audit
      port: 9000
      protocol: native
      server: clickhouse
      # Grafana interpolates $VAR in provisioning files; the compose file passes these through
      # from .env so the credentials are not duplicated here. (Grafana does not support shell
      # `${VAR:-default}` syntax — the defaults live in docker-compose-observability.yml.)
      username: $CLICKHOUSE_USERNAME
      secure: false
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
