# AuditFlow — Local stack
#
# RabbitMQ + Valkey + Cerbos + ClickHouse + transformer + sink + backend — the same stack the
# Kubernetes install runs (labs64.io-helm-charts), minus the gateway, so AuditFlow can be tested
# on its own. Dedup and per-tenant rate limiting are Redis-backed, as in the chart.
#
# Image pins mirror labs64.io-helm-charts (helmfile.yaml.gotmpl and the charts it deploys):
#   rabbitmq   overrides/rabbitmq/chart/values.yaml   image.tag   (official image, 4.3.x line)
#   valkey     bitnami/valkey chart 6.3.4             appVersion  9.1.x (official valkey image)
#   cerbos     charts/authz-pdp/Chart.yaml            appVersion
# Keep the tags in step when helm-charts moves them; the observability overlay lists the rest.
#
# Deliberate differences from Kubernetes: no Traefik/AuthProxy (so the auth-context filter and
# authz are off), and tenants come from the mounted ./tenants dir, not labelled ConfigMaps.
#
# Usage:
#   just up          # start stack
#   just down        # stop and remove containers
#   just logs        # tail all logs
#
# See .env.example for configurable variables.

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: auditflow-rabbitmq
    command: /bin/sh -c "rabbitmq-plugins enable rabbitmq_prometheus && docker-entrypoint.sh rabbitmq-server"
    ports:
      - "5673:5672"    # AMQP  (host 5673 → container 5672)
      - "15673:15672"  # Management UI  →  http://localhost:15673  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - auditflow-net

  # Valkey, not Redis OSS — the same engine as the bitnami/valkey release in helmfile.yaml.gotmpl
  # and as AWS ElastiCache. Standalone with auth on, matching overrides/redis/values.local.yaml.
  # Backs idempotency (dedup) and the per-tenant ingest rate limiter.
  redis:
    image: valkey/valkey:9.1-alpine
    container_name: auditflow-redis
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:-labs64pw}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-labs64pw}
    networks:
      - auditflow-net

  # ClickHouse (no counterpart in helmfile.yaml.gotmpl — it is a sink target, not platform
  # infrastructure): the clickhouse-analytics pipeline is enabled in ./tenants/demo.yaml and
  # ./tenants/_platform.yaml, so `just up` gives a working publish → sink → query
  # round trip out of the box.
  # Query it with `just ch-events` / `just ch "<SQL>"`; the end-to-end round trip with
  # assertions is section 6 of examples/getting-started.ipynb.
  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    container_name: auditflow-clickhouse
    ports:
      - "8123:8123"    # HTTP interface  →  http://localhost:8123/play
      - "9000:9000"    # Native protocol (clickhouse-client, JDBC/ODBC drivers)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-auditflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-auditflow}
      CLICKHOUSE_DB: audit
    volumes:
      # Canonical core schema, also parsed by the transformer contract test, plus the NetLicensing
      # use-case extension. Numbered targets because init scripts run in lexicographic order and
      # the extension ALTERs the core table.
      # Init scripts run only on an empty data dir — `just clean` drops the volume to re-apply.
      - ./examples/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./examples/clickhouse/schema-netlicensing.sql:/docker-entrypoint-initdb.d/02-schema-netlicensing.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"X-ClickHouse-User: $$CLICKHOUSE_USER\" --header=\"X-ClickHouse-Key: $$CLICKHOUSE_PASSWORD\" http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - auditflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Transformer service
  # ─────────────────────────────────────────────────────────────────────────────
  transformer:
    build:
      context: ./auditflow-transformer
      dockerfile: Dockerfile
    image: auditflow-transformer:local
    container_name: auditflow-transformer
    ports:
      - "8081:8081"
    volumes:
      # The bootstrap directory is the runtime extension point for transformers (a ConfigMap in
      # k8s, a bind mount here). It carries the NetLicensing example — `audit_clickhouse` itself
      # stays domain-free and ships in the image, while the licensing vocabulary layered on top
      # of it is mounted, which is exactly how an integrator adds their own.
      # Transformer modules only: the registry scans this directory for *.py and reports anything
      # without a `transform` entry point as a broken plugin.
      - ./examples/netlicensing:/home/l64user/transformers_bootstrap:ro
    environment:
      # No-code `extra` promotion: {extra key: target field}. Passed through from the host so
      # `AUDITFLOW_PROMOTED_KEYS='{"orderRef":"order_ref"}' just up` works without editing this file.
      # Unset or blank is treated as "no extra promotion" by auditflow_sdk.resolve_promoted.
      AUDITFLOW_PROMOTED_KEYS: ${AUDITFLOW_PROMOTED_KEYS:-}
    networks:
      - auditflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # Sink service
  # ─────────────────────────────────────────────────────────────────────────────
  sink:
    build:
      context: ./auditflow-sink
      dockerfile: Dockerfile
    image: auditflow-sink:local
    container_name: auditflow-sink
    ports:
      - "8082:8082"
    networks:
      - auditflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # Cerbos PDP (RFC-07) — central authorization decision point. Policies are
  # generated at build time into auditflow-be/target/cerbos/policies by the
  # exec-plugin (--cerbos-output); mounted here read-only.
  # ─────────────────────────────────────────────────────────────────────────────
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.56.0
    container_name: auditflow-cerbos
    command: ["server"]
    hostname: cerbos
    volumes:
      - ./auditflow-be/target/cerbos/policies:/policies:ro
    ports:
      - "3592:3592"
      - "3593:3593"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=grpc"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - auditflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend (Spring Boot)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./auditflow-be
      dockerfile: Dockerfile
    image: auditflow-be:local
    container_name: auditflow-backend
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_RABBITMQ_HOST: rabbitmq
      # Idempotency store and tenant rate limiter are both Redis-backed, as in the chart
      # (charts/auditflow/values.yaml: idempotency.store / tenants.ratelimit.backend = redis).
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-labs64pw}
      AUDITFLOW_IDEMPOTENCY_STORE: redis
      TENANTS_RATELIMIT_BACKEND: redis
      TRANSFORMER_LOCAL_URL: http://transformer:8081
      SINK_LOCAL_URL: http://sink:8082
      # Local compose runs without the Traefik gateway, so no trusted X-Auth-*
      # headers exist — disable the fail-closed auth-context filter AND authz
      # enforcement here only (without also disabling authz, the @Authorize
      # interceptor still denies with 401/no-auth-context as defense in depth).
      # In Kubernetes the gateway supplies the headers and both stay enabled,
      # with the central Cerbos PDP at cerbos.<ns>.svc.cluster.local:3593.
      LABS64_AUTHCONTEXT_ENABLED: "false"
      LABS64_AUTH_AUTHZ_ENABLED: "false"
      LABS64_AUTH_AUTHZ_PDPADDRESS: cerbos:3593
      # Pipelines live in ./tenants/_platform.yaml (mounted below) — the tenant model replaced
      # the -Dauditflow.pipelines[N].* JAVA_OPTS, which now fail startup by design.
      #
      # The redaction rules below demonstrate mask and drop. They deliberately target `userId`
      # and `apiKey` and NOT `sessionId`: redaction runs before the pipeline, so a redacted key
      # is silently empty in every sink — and `sessionId` is promoted to the `session_id` column
      # that the "active sessions per product" KPI counts. Redacting a reporting dimension makes
      # the dashboard wrong in a way that looks like no data rather than like an error.
      #
      # The per-tenant in-flight cap (tenants.consumer.max-in-flight-per-tenant) keeps its shipped
      # default (32): a delivery over it is deferred for a few seconds, never dead-lettered, so a
      # bulk seed such as `just ch-seed` completes in full.
      JAVA_OPTS: >-
        -Dauditflow.redaction.enabled=true
        -Dauditflow.redaction.rules[0].field=extra.userId
        -Dauditflow.redaction.rules[0].action=mask
        -Dauditflow.redaction.rules[1].field=extra.apiKey
        -Dauditflow.redaction.rules[1].action=drop
    volumes:
      - ./tenants:/config/tenants:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      transformer:
        condition: service_healthy
      sink:
        condition: service_healthy
      redis:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      # Not a backend dependency in the strict sense — the sink talks to ClickHouse, not the
      # backend. Waiting here anyway means the first published event cannot lose its race with
      # the schema init script and land in the DLQ.
      clickhouse:
        condition: service_healthy
    networks:
      - auditflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  auditflow-net:
    driver: bridge

volumes:
  clickhouse-data:
