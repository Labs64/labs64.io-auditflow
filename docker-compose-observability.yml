# AuditFlow — Observability overlay
#
# Adds OTel Collector, Tempo, Loki, Prometheus, and Grafana to the base stack.
#
# Same components, versions and registries as the monitoring layer in
# labs64.io-helm-charts/helmfile.yaml.gotmpl. The image tag is the appVersion of the chart pinned
# there (`helm show chart <chart> --version <pin>`); bump both in the same commit:
#
#   service         helmfile release (chart)                 chart    image
#   otel-collector  opentelemetry-collector                  0.175.0  otel/opentelemetry-collector-contrib:0.161.0
#   tempo           tempo (grafana-community/tempo)          3.1.0    grafana/tempo:3.1.0
#   loki            loki (grafana-community/loki)            18.13.8  grafana/loki:3.7.8
#   prometheus      prometheus (kube-prometheus-stack)       91.9.0   quay.io/prometheus/prometheus:v3.15.0-distroless
#   grafana         grafana (grafana-community/grafana)      13.2.7   grafana/grafana:13.2.3
#
# Compose on top of the stack:
#
#   just up obs        # stack + observability
#
# Grafana:    http://localhost:3000  (admin / admin)
# Prometheus: http://localhost:9090
# Tempo:      http://localhost:3200  (API; use Grafana for UI)
# Loki:       http://localhost:3100  (API; use Grafana for UI)

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: auditflow-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - auditflow-net

  tempo:
    image: grafana/tempo:3.1.0
    container_name: auditflow-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP query API (Grafana + direct curl for debugging)
    networks:
      - auditflow-net

  loki:
    image: grafana/loki:3.7.8
    container_name: auditflow-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0:0"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/tmp/loki
    ports:
      - "3100:3100"   # HTTP API (Grafana + direct curl for debugging)
    networks:
      - auditflow-net

  prometheus:
    # quay.io, like the kube-prometheus-stack chart (not Docker Hub's prom/prometheus).
    image: quay.io/prometheus/prometheus:v3.15.0-distroless
    container_name: auditflow-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      # Tempo's metrics generator pushes span metrics and the service graph here; the k8s
      # release sets prometheusSpec.enableRemoteWriteReceiver for the same reason.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - auditflow-net

  grafana:
    image: grafana/grafana:13.2.3
    container_name: auditflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Downloaded at container start — needs network access on first run.
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      # Interpolated into provisioning/datasources/datasources.yaml by Grafana itself.
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-auditflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-auditflow}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - auditflow-net

  # --- Service extensions: enable runtime instrumentation via env only (same images) ---

  backend:
    environment:
      # Activates the agent bundled in the image; without this overlay the JVM runs agent-free.
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: auditflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Metrics stay on Micrometer -> /actuator/prometheus scrape (dashboard-name stability);
      # flip to "otlp" to get agent semconv metrics + exemplars instead.
      OTEL_METRICS_EXPORTER: none
    depends_on:
      otel-collector:
        condition: service_started

  transformer:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: auditflow-transformer
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
    depends_on:
      otel-collector:
        condition: service_started

  sink:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: auditflow-sink
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
