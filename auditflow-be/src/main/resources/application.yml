server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: auditflow-backend

  # Spring Cloud Stream Configuration
  cloud:
    stream:
      default-binder: rabbit
      bindings:
        audit-out-0:
          destination: labs64-audit-topic
          content-type: application/json
        audit-in-0:
          destination: labs64-audit-topic
          # Named group → durable queue survives restarts; required for autoBindDlq / republishToDlq
          # to take effect. Queue name: <destination>.<group> = labs64-audit-topic.labs64.io-auditflow
          group: labs64.io-auditflow
          content-type: application/json
          consumer:
            # Router threads per pod (ingest queue). Routing only evaluates conditions and enqueues
            # delivery messages; the transformer/sink work runs in the delivery stage
            # (auditflow.delivery.*), so a few threads go a long way.
            concurrency: ${AUDITFLOW_CONSUMER_CONCURRENCY:8}
        quarantine-out-0:
          destination: labs64-audit-quarantine
          content-type: application/json
      binders:
        rabbit:
          type: rabbit
      rabbit:
        bindings:
          audit-out-0:
            producer:
              exchangeType: topic
              routing-key-expression: headers['routingKey']
          audit-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
              requeueRejected: false
              maxConcurrency: ${AUDITFLOW_CONSUMER_CONCURRENCY:8}
              prefetch: ${AUDITFLOW_CONSUMER_CONCURRENCY:8}
          quarantine-out-0:
            producer:
              exchangeType: topic

  # RabbitMQ Configuration
  rabbitmq:
    host: rabbitmq.default.svc.cluster.local
    port: 5672
    # Credentials MUST be supplied via environment variables RABBITMQ_USERNAME and RABBITMQ_PASSWORD.
    # Empty defaults are intentionally omitted to prevent accidental unauthenticated connections.
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 10s
    # End-to-end acknowledgement: every publish waits for the broker's confirm, and an unroutable
    # message comes back (mandatory) instead of being dropped. A 200 from /audit/publish therefore
    # means the broker stored the event (ConfirmingPublisher).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true
      mandatory: true

  # Redis (idempotency / dedup)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Trusted gateway auth-context (auth-context-spring-boot-starter).
# Fail-closed: non-public paths 401 without valid X-Auth-* headers from the
# gateway. Disabled in docker-compose (no gateway there); enabled in k8s.
labs64:
  auth:
    # Domain authorization via the central Cerbos PDP. SHADOW evaluates + audits
    # every decision without blocking; flip to ENFORCE only after the shadow
    # diff is clean (deploy-time override via LABS64_AUTH_AUTHZ_MODE).
    authz:
      enabled: ${LABS64_AUTH_AUTHZ_ENABLED:true}
      mode: ${LABS64_AUTH_AUTHZ_MODE:ENFORCE}
      # Cerbos PDP gRPC address (host:port). In-cluster:
      # cerbos.<ns>.svc.cluster.local:3593.
      pdp-address: ${LABS64_AUTH_AUTHZ_PDPADDRESS:localhost:3593}
  auth-context:
    enabled: true
    public-paths:
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /error

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,dlq,pipelines
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    dlq:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # Tracing/log export is infrastructure-owned: the OTel Java Agent (bundled in the image,
  # activated via JAVA_TOOL_OPTIONS) reads standard OTEL_* environment variables.
  # Sampling: OTEL_TRACES_SAMPLER / OTEL_TRACES_SAMPLER_ARG on the deployment.

  # Metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Publish an le=0.5s histogram bucket so the latency SLO rule
      # (slo:latency:ratio_rate5m) has a bucket to divide on.
      slo:
        http.server.requests: 500ms
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    io.labs64: DEBUG
    org.springframework.cloud.stream: INFO
    org.springframework.amqp: WARN
    # Suppress verbose stack traces from the framework when intentional DLQ redelivery is exhausted.
    # AuditService already logs the root cause cleanly.
    org.springframework.integration.handler.advice.ErrorMessageSendingRecoverer: OFF
    org.springframework.amqp.rabbit.listener: OFF
    org.springframework.integration.handler.LoggingHandler: OFF

# Transformer Discovery Configuration
transformer:
  discovery:
    mode: local   # "local" or "kubernetes"
  local:
    url: "http://localhost:8081"
  service:
    name: auditflow-transformer
    namespace: default
    # Note: for kubernetes mode the port is read from the K8s Service spec, not from config.

# Sink Discovery Configuration
sink:
  discovery:
    mode: local   # "local" or "kubernetes"
  local:
    url: "http://localhost:8082"
  service:
    name: auditflow-sink
    namespace: default
    port: 8082

# Tenant model (silo isolation). Config SOURCE is a pluggable read-port; Core is read-only.
# Built-in defaults boot on ANY infrastructure (no K8s API, no Redis). The Helm chart pins the
# k8s-native modes for cluster installs: gitops-configmap / redis / k8s-secret.
tenants:
  source:
    mode: local-dir          # local-dir (default) | gitops-configmap
    local-dir:
      path: /config/tenants  # used only when mode=local-dir; missing dir = zero tenants, not an error
  ratelimit:
    backend: in-memory       # in-memory (default, single replica) | redis (multi-replica) | none
  consumer:
    # Deliveries of ONE tenant processed at once per pod (fairness): half of the delivery units
    # (delivery.concurrency x delivery.unit-concurrency = 64), so a busy tenant can never take a pod
    # over. A delivery over the cap waits up to max-wait-millis, then is deferred (no attempt spent).
    max-in-flight-per-tenant: 32
    # A consumer thread over the cap waits this long for a slot before the event is redelivered
    # (each redelivery counts towards the DLQ). Bounded so the thread returns to other tenants.
    max-wait-millis: 2000
secretRef:
  resolver: env              # env (default) | k8s-secret

# Pipeline Configuration
# DEPRECATED: global pipelines no longer participate in routing (tenant model). A non-empty list
# FAILS startup — move pipelines into a tenant config (tenants/<id>.yaml or a tenant ConfigMap).
auditflow:
  pipelines: []
  # Idempotency / dedup store + TTLs (ISO-8601 durations)
  idempotency:
    # "redis" (default; clustered, survives restart) or "memory" (single-process, for the local
    # stack — see docker-compose.yml — so no external Redis is required).
    store: redis
    claim-ttl: PT5M
    # Must outlive the longest delivery retry window (delivery.retry.max-age), or a late duplicate
    # of a delivery could be delivered twice.
    done-ttl: PT48H
  # Broker topology of the two-stage delivery model (delivery/BrokerTopology).
  broker:
    # classic (default) or quorum (replicated; for multi-node brokers such as an Amazon MQ cluster).
    # Applies to the delivery, delay and DLQ queues; changing it needs the queues deleted first.
    queue-type: ${AUDITFLOW_BROKER_QUEUE_TYPE:classic}
    # How long a publish waits for the broker's confirm before it counts as failed (503 at ingest).
    confirm-timeout: PT5S
  # Delivery stage (delivery/DeliveryWorker): one message per event and pipeline.
  delivery:
    enabled: true
    # Consumers on the delivery queue per pod; each takes up to batch-size messages at a time.
    concurrency: ${AUDITFLOW_DELIVERY_CONCURRENCY:4}
    batch-size: ${AUDITFLOW_DELIVERY_BATCH_SIZE:50}
    # A consumer closes its batch after this long without new messages (latency bound when idle).
    batch-receive-timeout: PT1S
    # Deliveries of one received batch run concurrently up to this bound.
    unit-concurrency: 16
    # Defaults of the per-pipeline `retry` block in tenant files: retried with growing delays
    # (5s, 30s, 2m, 10m, 30m, 1h, then every 3h) until delivered, max-attempts failures, or max-age
    # since routing; then dead-lettered to the tenant's DLQ. Backpressure does not spend attempts.
    retry:
      max-attempts: 20
      max-age: PT24H
  # Retry/backoff for outbound transformer & sink HTTP calls.
  # Only transient failures (5xx, connection/timeout) are retried; 4xx is never retried.
  http:
    retry:
      enabled: true
      max-attempts: 3        # retries after the initial try (total tries = 1 + max-attempts)
      min-backoff: PT0.2S    # grows exponentially with jitter on each subsequent retry
  # PII de-identification applied at ingest, BEFORE publish, so raw PII never enters the broker.
  # Global (not per-pipeline). Field paths use dot/array notation. Disabled by default.
  # The 'hash' action is an HMAC-SHA256 under a secret key (equal values still give equal hashes).
  # A rule that uses it needs AUDITFLOW_REDACTION_HASH_KEY (auditflow.redaction.hash-key), at least
  # 32 characters, from a secret: without it the application does not start. Changing the key
  # changes every hash from then on.
  redaction:
    enabled: false
    mask: "***"
    rules: []
#    rules:
#      - field: 'actor'
#        action: 'hash'           # mask | hash | drop
#      - field: 'extra.userEmail'
#        action: 'mask'
#      - field: 'extra.ssn'
#        action: 'drop'
  # Rate limiting per pipeline. Disabled by default. Enable to protect against event storms.
  ratelimit:
    enabled: false
    default-limit-for-period: 1000
    default-limit-refresh-period: PT1S
    default-timeout-duration: PT0.1S
  # Circuit breaker configuration for outbound HTTP calls
  circuitbreaker:
    enabled: true
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50.0
    wait-duration-in-open-state: PT15S
    permitted-number-of-calls-in-half-open-state: 3
    slow-call-rate-threshold: 100.0
    slow-call-duration-threshold: PT2S
    time-limiter-timeout: PT15S
    # Concurrent calls per transformer/sink target; >= delivery concurrency x unit-concurrency.
    bulkhead-max-concurrent-calls: 128

